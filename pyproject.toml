[project]
name = "argumentative-reward-shaping-lbf"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "lbforaging==2.0.0",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pandas>=3.1.1",
    "pyglet>=1.5,<2",
    "pyyaml>=6.0.3",
    "scipy>=1.17.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/argrl"]

[tool.pytest.ini_options]
# Tests find src/ directly, so they don't depend on the editable install's .pth file
# (which this Mac keeps hiding; see docs/decisions.md D13).
pythonpath = ["src"]
